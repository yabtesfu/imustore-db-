[project]
name = "imustore-db"
version = "0.1.0"
description = "An educational append-only key-value database with immutable indexing."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "yabtesfu" }]
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
imustore = "imustore.tool:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
